name: LIL FlashInfer CUDA 13.4 SM120 wheels

on:
  push:
    branches:
      - community/jovian-judgement-cu134-sm120
    tags:
      - flashinfer-cu134-sm120-stable-*

permissions:
  contents: write

concurrency:
  group: lil-flashinfer-cu134-sm120-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-beta:
    if: github.repository == 'local-inference-lab/flashinfer' && github.ref_type == 'branch'
    runs-on: [self-hosted, lil-wheel-builder]
    # Six hours for the shared-worker lock plus six hours for compilation.
    timeout-minutes: 720
    steps:
      - name: Check out the exact FlashInfer source and submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Build and verify the source-addressed wheels
        run: >-
          flock --exclusive --wait 21600
          /var/lib/github-flashinfer/locks/cu134-sm120-build.lock
          ci/lil_wheels/build_bundle.sh

      - name: Publish the immutable beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="flashinfer-cu134-sm120-beta-${GITHUB_SHA}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            mkdir existing-release
            gh release download "${tag}" --dir existing-release
            python3 ci/lil_wheels/verify_release_assets.py \
              --directory existing-release \
              --source-commit "${GITHUB_SHA}" \
              --beta-tag "${tag}"
            echo "Immutable release ${tag} exists and satisfies the asset contract."
            exit 0
          fi
          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "FlashInfer CUDA 13.4 SM120 beta ${GITHUB_SHA:0:12}" \
            --notes-file dist/lil-flashinfer-wheels/release-notes.md \
            dist/lil-flashinfer-wheels/bundle/wheels/*.whl \
            dist/lil-flashinfer-wheels/bundle/manifest.json \
            dist/lil-flashinfer-wheels/bundle/SHA256SUMS \
            dist/lil-flashinfer-wheels/bundle/requirements-github.txt \
            dist/lil-flashinfer-wheels/bundle/install.sh \
            dist/lil-flashinfer-wheels/bundle/runtime.lock \
            dist/lil-flashinfer-wheels/flashinfer-cu134-sm120-*.tar.zst \
            dist/lil-flashinfer-wheels/flashinfer-cu134-sm120-*.tar.zst.sha256

  promote-stable:
    if: github.repository == 'local-inference-lab/flashinfer' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tagged release verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Promote the wheel bytes produced for the tagged source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          beta_tag="flashinfer-cu134-sm120-beta-${GITHUB_SHA}"
          stable_tag="${GITHUB_REF_NAME}"
          mkdir assets
          gh release download "${beta_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir assets
          python ci/lil_wheels/verify_release_assets.py \
            --directory assets \
            --source-commit "${GITHUB_SHA}" \
            --beta-tag "${beta_tag}"
          if gh release view "${stable_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            mkdir existing-stable-release
            gh release download "${stable_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --dir existing-stable-release
            python ci/lil_wheels/verify_release_assets.py \
              --directory existing-stable-release \
              --source-commit "${GITHUB_SHA}" \
              --beta-tag "${beta_tag}" \
              --promotion
            echo "Immutable stable release ${stable_tag} satisfies the asset contract."
            exit 0
          fi
          jq -n \
            --arg status qualified \
            --arg source_release "${beta_tag}" \
            --arg source_commit "${GITHUB_SHA}" \
            --arg source_manifest_sha256 "$(sha256sum assets/manifest.json | awk '{print $1}')" \
            '{schema: "local-inference-flashinfer-promotion/v1", status: $status,
              source_release: $source_release, source_commit: $source_commit,
              source_manifest_sha256: $source_manifest_sha256,
              invariant: "Wheel files and wheel SHA-256 digests are unchanged from the source beta release."}' \
            > assets/stable-promotion.json
          gh release create "${stable_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "FlashInfer CUDA 13.4 SM120 stable ${GITHUB_SHA:0:12}" \
            --notes "Qualified promotion of ${beta_tag}. Wheel bytes were not rebuilt." \
            assets/*
